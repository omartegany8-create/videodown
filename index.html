<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#7c3aed">
<title>VideoDown - حمّل أي فيديو بسهولة</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --p1:#7c3aed; --p2:#a855f7; --p3:#c026d3;
  --bg1:#f4efff; --bg2:#e9defd; --card:#ffffffcc; --card-s:#f3ecff;
  --text:#1e1146; --muted:#6b5f8f; --border:#d9c9fb; --input:#ffffff;
  --shadow:0 10px 30px rgba(124,58,237,.18);
}
html[data-theme="dark"]{
  --bg1:#1a0b3d; --bg2:#0f0627; --card:#ffffff0d; --card-s:#ffffff10;
  --text:#f4efff; --muted:#a99bd1; --border:#ffffff22; --input:#ffffff0f;
  --shadow:0 10px 30px rgba(0,0,0,.45);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{
  font-family:'Cairo',system-ui,sans-serif;color:var(--text);
  background:radial-gradient(circle at 20% 0%,var(--bg1),var(--bg2) 70%) fixed;
  display:flex;justify-content:center;
}
.app{
  width:100%;max-width:480px;min-height:100vh;min-height:100dvh;
  display:flex;flex-direction:column;position:relative;overflow:hidden;
}
@media(min-width:520px){
  body{align-items:center;padding:24px}
  .app{min-height:0;height:min(900px,calc(100vh - 48px));border-radius:42px;border:3px solid var(--p2);
    box-shadow:0 0 0 6px rgba(168,85,247,.15),0 30px 80px rgba(124,58,237,.35);
    background:radial-gradient(circle at 20% 0%,var(--bg1),var(--bg2) 70%)}
}
.top{display:flex;align-items:center;justify-content:space-between;padding:18px 18px 0}
.pro{display:flex;align-items:center;gap:5px;background:linear-gradient(135deg,#fde68a,#f59e0b);color:#5a3a00;
  font-weight:800;font-size:13px;padding:5px 12px;border-radius:999px}
.icon-btn{width:40px;height:40px;border-radius:50%;border:0;background:var(--card);color:var(--text);
  display:grid;place-items:center;cursor:pointer;border:1px solid var(--border)}
.icon-btn svg{width:22px;height:22px}
.brand{text-align:center;margin-top:-6px}
.logo-row{display:flex;align-items:center;justify-content:center;gap:10px}
.logo-row h1{margin:0;font-size:34px;font-weight:800;letter-spacing:-.5px}
.logo-row h1 span{background:linear-gradient(90deg,var(--p1),var(--p3));-webkit-background-clip:text;background-clip:text;color:transparent}
.brand p{margin:2px 0 0;color:var(--muted);font-size:13px}
.scroll{flex:1;overflow-y:auto;padding:0 18px 100px;scrollbar-width:none}
.scroll::-webkit-scrollbar{display:none}
.tab{display:none}.tab.active{display:block;animation:fade .3s}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.hero{display:block;width:78%;max-width:300px;margin:6px auto 0;filter:drop-shadow(0 14px 22px rgba(124,58,237,.35))}
.float{animation:float 4s ease-in-out infinite}.float.d{animation-delay:-2s}
@keyframes float{50%{transform:translateY(-7px)}}
.field{display:flex;align-items:center;gap:10px;background:var(--input);border:1.5px solid var(--border);
  border-radius:18px;padding:0 14px;height:58px;margin-top:8px;transition:.2s}
.field:focus-within{border-color:var(--p2);box-shadow:0 0 0 4px rgba(168,85,247,.18)}
.field svg{width:24px;height:24px;color:var(--p2);flex:none}
.field input{flex:1;min-width:0;border:0;background:none;outline:0;color:var(--text);font:inherit;font-size:15px;direction:ltr;text-align:left}
.field input::placeholder{color:var(--muted);direction:rtl}
.field .clear{background:none;border:0;color:var(--muted);cursor:pointer;display:none;padding:4px}
.field.has .clear{display:block}
.btn{width:100%;height:58px;border:0;border-radius:18px;margin-top:14px;color:#fff;font:inherit;font-weight:800;font-size:18px;
  cursor:pointer;background:linear-gradient(90deg,var(--p1),var(--p2) 55%,var(--p3));
  box-shadow:0 10px 24px rgba(124,58,237,.45);transition:.15s;display:flex;align-items:center;justify-content:center;gap:10px}
.btn:active{transform:scale(.98)}
.btn[disabled]{opacity:.75;pointer-events:none}
.spin{width:22px;height:22px;border:3px solid #fff5;border-top-color:#fff;border-radius:50%;animation:sp .7s linear infinite;display:none}
.loading .spin{display:block}
@keyframes sp{to{transform:rotate(360deg)}}
.err{display:none;margin-top:12px;padding:12px 14px;border-radius:14px;background:#ef444422;border:1px solid #ef444466;color:#ef4444;font-size:14px;font-weight:600}
.sec-title{display:flex;align-items:center;gap:6px;margin:20px 2px 10px;font-weight:700;font-size:14px}
.chips{display:flex;gap:8px}
.chip{flex:1;display:flex;align-items:center;justify-content:center;gap:7px;height:42px;border-radius:999px;
  background:var(--card);border:1px solid var(--border);color:var(--text);font:inherit;font-weight:600;font-size:13px;cursor:pointer}
.dot{width:12px;height:12px;border-radius:4px}
.features{background:var(--card-s);border:1px solid var(--border);border-radius:22px;padding:14px}
.features .sec-title{margin:0 2px 12px}
.fgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.f{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:10px 4px;text-align:center;font-size:11px;font-weight:700}
.f i{display:grid;place-items:center;width:38px;height:38px;margin:0 auto 6px;border-radius:12px;font-style:normal;font-size:20px}
.nav{position:absolute;bottom:0;left:0;right:0;display:flex;justify-content:space-around;padding:10px 12px 16px;
  background:var(--bg1);border-top:1px solid var(--border);backdrop-filter:blur(14px)}
html[data-theme="dark"] .nav{background:#150a33f2}
.nav button{background:none;border:0;color:var(--muted);font:inherit;font-size:12px;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;flex:1}
.nav button svg{width:26px;height:26px}
.nav button.on{color:var(--p2)}
.nav::after{content:"";position:absolute;bottom:5px;left:50%;transform:translateX(-50%);width:120px;height:4px;border-radius:9px;background:var(--muted);opacity:.5}
/* sheet */
.overlay{position:absolute;inset:0;background:#0008;opacity:0;pointer-events:none;transition:.25s;z-index:20}
.overlay.show{opacity:1;pointer-events:auto}
.sheet{position:absolute;left:0;right:0;bottom:0;z-index:21;background:var(--bg1);border-radius:28px 28px 0 0;padding:14px 18px 24px;
  transform:translateY(100%);transition:.35s cubic-bezier(.2,.8,.2,1);max-height:82%;overflow-y:auto;border-top:2px solid var(--p2)}
html[data-theme="dark"] .sheet{background:#1b0d42}
.sheet.show{transform:none}
.grab{width:44px;height:5px;border-radius:9px;background:var(--border);margin:0 auto 14px}
.vid{display:flex;gap:12px;align-items:center}
.vid img{width:110px;height:68px;border-radius:12px;object-fit:cover;background:var(--card-s);flex:none}
.vid h3{margin:0;font-size:15px;line-height:1.5;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.vid small{color:var(--muted)}
.fmts{display:grid;gap:10px;margin-top:16px}
.fmt{display:flex;align-items:center;justify-content:space-between;padding:12px 14px;border-radius:16px;background:var(--card);
  border:1px solid var(--border);color:var(--text);text-decoration:none;font-weight:700}
.fmt span small{display:block;color:var(--muted);font-weight:600;font-size:12px}
.fmt b{background:linear-gradient(90deg,var(--p1),var(--p3));color:#fff;border-radius:12px;padding:8px 14px;font-size:14px}
/* history / more */
.list{display:grid;gap:10px;margin-top:16px}
.item{display:flex;gap:12px;align-items:center;background:var(--card);border:1px solid var(--border);border-radius:16px;padding:10px}
.item img{width:70px;height:48px;border-radius:10px;object-fit:cover;background:var(--card-s)}
.item div{flex:1;min-width:0;font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item small{color:var(--muted);font-weight:400}
.empty{text-align:center;color:var(--muted);padding:50px 0}
.row{display:flex;justify-content:space-between;align-items:center;background:var(--card);border:1px solid var(--border);border-radius:16px;padding:14px 16px;margin-top:10px;font-weight:700;cursor:pointer}
.switch{width:46px;height:26px;border-radius:99px;background:var(--border);position:relative;transition:.2s}
.switch::after{content:"";position:absolute;top:3px;right:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:.2s}
html[data-theme="dark"] .switch{background:var(--p2)}
html[data-theme="dark"] .switch::after{right:23px}
.note{color:var(--muted);font-size:12.5px;line-height:1.9;margin-top:18px;text-align:center}
</style>
</head>
<body>
<div class="app" id="app">

  <div class="top">
    <div class="pro">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M3 8l4 3 5-6 5 6 4-3-2 11H5L3 8z"/></svg>Pro
    </div>
    <button class="icon-btn" id="themeBtn" aria-label="الإعدادات">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 00.3 1.8l.1.1a2 2 0 11-2.8 2.8l-.1-.1a1.7 1.7 0 00-1.8-.3 1.7 1.7 0 00-1 1.5V21a2 2 0 11-4 0v-.1a1.7 1.7 0 00-1.1-1.5 1.7 1.7 0 00-1.8.3l-.1.1a2 2 0 11-2.8-2.8l.1-.1a1.7 1.7 0 00.3-1.8 1.7 1.7 0 00-1.5-1H3a2 2 0 110-4h.1a1.7 1.7 0 001.5-1.1 1.7 1.7 0 00-.3-1.8l-.1-.1a2 2 0 112.8-2.8l.1.1a1.7 1.7 0 001.8.3H9a1.7 1.7 0 001-1.5V3a2 2 0 114 0v.1a1.7 1.7 0 001 1.5 1.7 1.7 0 001.8-.3l.1-.1a2 2 0 112.8 2.8l-.1.1a1.7 1.7 0 00-.3 1.8V9a1.7 1.7 0 001.5 1H21a2 2 0 110 4h-.1a1.7 1.7 0 00-1.5 1z"/></svg>
    </button>
  </div>

  <div class="brand">
    <div class="logo-row">
      <svg width="58" height="50" viewBox="0 0 64 52"><defs><linearGradient id="lg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#8b5cf6"/><stop offset="1" stop-color="#c026d3"/></linearGradient></defs>
        <path d="M16 46a12 12 0 01-1-24 16 16 0 0130-3 13 13 0 013 27z" fill="url(#lg)"/>
        <path d="M32 18v17m-8-7l8 8 8-8" stroke="#fff" stroke-width="4.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <h1>Video<span>Down</span></h1>
    </div>
    <p>احفظ أي فيديو بسهولة وسرعة 💜</p>
  </div>

  <div class="scroll">

    <!-- HOME -->
    <section class="tab active" id="tab-home">
      <svg class="hero" viewBox="0 0 320 220" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <linearGradient id="c1" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#8b5cf6"/><stop offset="1" stop-color="#4c1d95"/></linearGradient>
          <linearGradient id="c2" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#a855f7"/><stop offset="1" stop-color="#7c3aed"/></linearGradient>
        </defs>
        <g opacity=".55" fill="#c4b5fd"><ellipse cx="160" cy="175" rx="140" ry="32"/><circle cx="70" cy="165" r="30"/><circle cx="250" cy="160" r="34"/><circle cx="160" cy="150" r="42"/></g>
        <g class="float"><rect x="18" y="38" width="62" height="50" rx="14" fill="#ef4444" transform="rotate(-10 49 63)"/><path d="M40 52l24 11-24 11z" fill="#fff" transform="rotate(-10 49 63)"/></g>
        <g class="float d"><rect x="236" y="48" width="56" height="56" rx="16" fill="#111827" transform="rotate(8 264 76)"/><path d="M268 62v22a8 8 0 11-6-8" stroke="#fff" stroke-width="5" fill="none" stroke-linecap="round" transform="rotate(8 264 76)"/></g>
        <g class="float"><rect x="48" y="118" width="44" height="52" rx="14" fill="#2563eb" transform="rotate(12 70 144)"/><text x="70" y="160" font-size="34" font-weight="800" fill="#fff" text-anchor="middle" transform="rotate(12 70 144)">f</text></g>
        <g transform="rotate(-12 160 100)">
          <rect x="102" y="62" width="118" height="82" rx="10" fill="url(#c1)"/>
          <rect x="102" y="40" width="118" height="26" rx="6" fill="#1e1b4b"/>
          <g fill="#fff"><path d="M110 40l16 0-10 26-16 0z"/><path d="M142 40l16 0-10 26-16 0z"/><path d="M174 40l16 0-10 26-16 0z"/><path d="M206 40l14 0 0 26-24 0z"/></g>
          <path d="M146 84l40 22-40 22z" fill="#fff"/>
        </g>
        <circle cx="232" cy="150" r="30" fill="url(#c2)" stroke="#fff" stroke-opacity=".5" stroke-width="3"/>
        <path d="M232 136v22m-9-8l9 9 9-9" stroke="#fff" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
        <g fill="#a78bfa"><path d="M28 112l5 10 10 5-10 5-5 10-5-10-10-5 10-5z" transform="scale(.7) translate(10 120)"/><circle cx="270" cy="30" r="4"/><circle cx="110" cy="22" r="3"/></g>
      </svg>

      <form id="form" autocomplete="off">
        <div class="field" id="field">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M10 14a5 5 0 007 0l3-3a5 5 0 00-7-7l-1 1"/><path d="M14 10a5 5 0 00-7 0l-3 3a5 5 0 007 7l1-1"/></svg>
          <input id="url" type="url" inputmode="url" placeholder="أدخل رابط الفيديو هنا..." >
          <button type="button" class="clear" id="clear" aria-label="مسح">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
          </button>
        </div>
        <div class="err" id="err"></div>
        <button class="btn" id="go" type="submit"><span class="spin"></span><span id="goTxt">تحميل الفيديو</span></button>
      </form>

      <div class="sec-title">💡 أمثلة على الروابط:</div>
      <div class="chips">
        <button class="chip" data-ex="https://www.youtube.com/watch?v="><span class="dot" style="background:#ef4444"></span>YouTube</button>
        <button class="chip" data-ex="https://www.tiktok.com/@"><span class="dot" style="background:#111"></span>TikTok</button>
        <button class="chip" data-ex="https://www.facebook.com/watch/?v="><span class="dot" style="background:#2563eb"></span>Facebook</button>
      </div>

      <div class="features" style="margin-top:20px">
        <div class="sec-title">⭐ مميزات التطبيق</div>
        <div class="fgrid">
          <div class="f"><i style="background:#f59e0b22">⚡</i>تحميل سريع</div>
          <div class="f"><i style="background:#22c55e22">🛡️</i>جودة عالية</div>
          <div class="f"><i style="background:#3b82f622">⬇️</i>جميع الصيغ</div>
          <div class="f"><i style="background:#ec489922">🚫</i>بدون إعلانات</div>
        </div>
      </div>
    </section>

    <!-- HISTORY -->
    <section class="tab" id="tab-history">
      <div class="sec-title" style="margin-top:22px;font-size:17px">🕘 سجل التحميلات</div>
      <div class="list" id="histList"></div>
      <button class="row" id="clearHist" style="width:100%;border:1px solid var(--border);color:#ef4444;font:inherit;display:none"><span>مسح السجل</span></button>
    </section>

    <!-- MORE -->
    <section class="tab" id="tab-more">
      <div class="sec-title" style="margin-top:22px;font-size:17px">👑 المزيد</div>
      <div class="row" id="themeRow"><span>🌙 الوضع الداكن</span><div class="switch"></div></div>
      <p class="note">
        الخدمة للاستخدام الشخصي فقط.<br>
        تأكد إن عندك حق تحميل المحتوى، واحترم حقوق صُنّاعه وشروط استخدام كل منصة.
      </p>
    </section>
  </div>

  <div class="nav">
    <button data-tab="home" class="on">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 3l9 8h-3v9h-5v-6H11v6H6v-9H3z"/></svg>الرئيسية</button>
    <button data-tab="history">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>سجل التحميلات</button>
    <button data-tab="more">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M3 8l4 3 5-6 5 6 4-3-2 11H5z"/></svg>المزيد</button>
  </div>

  <div class="overlay" id="ov"></div>
  <div class="sheet" id="sheet">
    <div class="grab"></div>
    <div class="vid"><img id="thumb" alt=""><div><h3 id="vtitle"></h3><small id="vmeta"></small></div></div>
    <div class="fmts" id="fmts"></div>
  </div>
</div>

<script>
const $ = s => document.querySelector(s);
const $$ = s => [...document.querySelectorAll(s)];
const API = ""; // لو السيرفر على دومين تاني اكتبه هنا

/* theme */
const root = document.documentElement;
function setTheme(t){ root.dataset.theme = t; try{localStorage.setItem("theme",t)}catch(e){} }
setTheme((()=>{try{return localStorage.getItem("theme")}catch(e){}})() || (matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light"));
const toggleTheme = () => setTheme(root.dataset.theme==="dark"?"light":"dark");
$("#themeBtn").onclick = toggleTheme; $("#themeRow").onclick = toggleTheme;

/* tabs */
$$(".nav button").forEach(b=>b.onclick=()=>{
  $$(".nav button").forEach(x=>x.classList.toggle("on",x===b));
  $$(".tab").forEach(t=>t.classList.toggle("active",t.id==="tab-"+b.dataset.tab));
  if(b.dataset.tab==="history") renderHistory();
});

/* input */
const url=$("#url"), field=$("#field");
url.addEventListener("input",()=>field.classList.toggle("has",!!url.value));
$("#clear").onclick=()=>{url.value="";field.classList.remove("has");url.focus();hideErr()};
$$(".chip").forEach(c=>c.onclick=()=>{url.value=c.dataset.ex;field.classList.add("has");url.focus()});

const showErr=m=>{const e=$("#err");e.textContent=m;e.style.display="block"};
const hideErr=()=>$("#err").style.display="none";

/* sheet */
const sheet=$("#sheet"), ov=$("#ov");
const openSheet=()=>{sheet.classList.add("show");ov.classList.add("show")};
const closeSheet=()=>{sheet.classList.remove("show");ov.classList.remove("show")};
ov.onclick=closeSheet;

const fmtDur=s=>{if(!s)return"";s=Math.round(s);const m=Math.floor(s/60),r=s%60;return m+":"+String(r).padStart(2,"0")};
const fmtSize=b=>b?(b/1048576).toFixed(1)+" MB":"";

/* history */
const getHist=()=>{try{return JSON.parse(localStorage.getItem("hist")||"[]")}catch(e){return[]}};
const saveHist=v=>{try{
  const h=getHist().filter(x=>x.url!==v.url); h.unshift(v);
  localStorage.setItem("hist",JSON.stringify(h.slice(0,50)));
}catch(e){}};
function renderHistory(){
  const h=getHist(), l=$("#histList");
  $("#clearHist").style.display=h.length?"flex":"none";
  if(!h.length){l.innerHTML='<div class="empty">لسه مفيش تحميلات 📭</div>';return}
  l.innerHTML="";
  h.forEach(x=>{
    const a=document.createElement("div");a.className="item";
    const img=document.createElement("img");img.src=x.thumb||"";img.alt="";
    const d=document.createElement("div");
    d.textContent=x.title;
    const s=document.createElement("small");s.style.display="block";s.textContent=new Date(x.at).toLocaleDateString("ar-EG");
    d.appendChild(s);a.append(img,d);
    a.onclick=()=>{$('[data-tab="home"]').click();url.value=x.url;field.classList.add("has")};
    l.appendChild(a);
  });
}
$("#clearHist").onclick=()=>{try{localStorage.removeItem("hist")}catch(e){};renderHistory()};

/* submit */
$("#form").addEventListener("submit",async e=>{
  e.preventDefault(); hideErr();
  const link=url.value.trim();
  if(!/^https?:\/\//i.test(link)) return showErr("من فضلك الصق رابط صحيح يبدأ بـ http أو https");
  const btn=$("#go"); btn.disabled=true; btn.classList.add("loading"); $("#goTxt").textContent="جاري التحليل...";
  try{
    const r=await fetch(API+"/api/info",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({url:link})});
    const d=await r.json();
    if(!r.ok) throw new Error(d.error||"حصل خطأ، حاول تاني");
    $("#thumb").src=d.thumbnail||"";
    $("#vtitle").textContent=d.title;
    $("#vmeta").textContent=[d.uploader,fmtDur(d.duration)].filter(Boolean).join(" • ");
    const box=$("#fmts"); box.innerHTML="";
    d.formats.forEach(f=>{
      const a=document.createElement("a");a.className="fmt";
      a.href=API+"/api/dl?url="+encodeURIComponent(link)+"&fid="+encodeURIComponent(f.id);
      const sp=document.createElement("span");sp.textContent=f.label;
      const sm=document.createElement("small");sm.textContent=[f.ext.toUpperCase(),fmtSize(f.size)].filter(Boolean).join(" • ");
      sp.appendChild(sm);
      const b=document.createElement("b");b.textContent="تحميل";
      a.append(sp,b);box.appendChild(a);
    });
    saveHist({url:link,title:d.title,thumb:d.thumbnail,at:Date.now()});
    openSheet();
  }catch(err){ showErr(err.message||"تعذّر الاتصال بالسيرفر"); }
  finally{ btn.disabled=false; btn.classList.remove("loading"); $("#goTxt").textContent="تحميل الفيديو"; }
});
</script>
</body>
</html>
